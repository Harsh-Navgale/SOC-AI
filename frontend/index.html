<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOC-AI Dashboard</title>
    <script>
      // Runs before anything renders, so the correct theme is set on first paint instead of
      // flashing dark (the default) and then switching to a saved/system light preference.
      (function () {
        var stored = localStorage.getItem('soc_theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
