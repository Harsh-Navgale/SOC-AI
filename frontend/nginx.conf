# Lets /api/ proxy both plain HTTP and the WebSocket upgrade handshake (for /api/ws/events)
# through the same location block — Connection is only set to "upgrade" when the client
# actually asked for one, so ordinary HTTP requests keep normal keep-alive behavior.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # Everything this app loads (scripts, styles, fonts) is self-hosted in /assets — no CDN,
    # no third-party API calls from the browser (the backend proxies all of that) — so a tight
    # default-src 'self' costs nothing. script-src/style-src need 'unsafe-inline' for the
    # theme-flash-prevention <script> in index.html and React's style={{}} prop usage.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;

    # nginx defaults to 1MB max request body — a real Wazuh agent CSV export (hundreds or
    # thousands of agents, several columns) can easily exceed that and would otherwise be
    # silently rejected with a 413 before even reaching the backend's own upload handling.
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A single /api/ask generation can legitimately take a while (a large prompt, a slow
        # model, or a cold Bedrock region) — generous headroom so nginx never cuts the
        # connection before the backend has a chance to respond itself.
        proxy_read_timeout 260s;
    }

    # A raw Wazuh alerts.json export can run to tens or hundreds of GB — main.py's
    # upload_alerts() streams anything over its own in-memory threshold straight to disk and
    # returns almost immediately (the actual import runs as a background job, polled via
    # /api/alerts/upload/status/{id}), so this only needs enough room and time for the
    # *transfer* itself, not for however long the import takes. Matched by nginx before the
    # general /api/ block below since it's the more specific prefix.
    #
    # No size cap (client_max_body_size 0) and day-long timeouts: this app has no way to know
    # the uploader's connection speed, and client_body_timeout/proxy_send_timeout only fire on a
    # stall between successive bytes, not on total duration — so a generous ceiling here costs
    # nothing for a fast transfer and doesn't risk killing a slow one hours in.
    location /api/alerts/upload {
        proxy_pass http://backend:8080/api/alerts/upload;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 0;
        client_body_timeout 1d;
        proxy_send_timeout 1d;
        proxy_read_timeout 1d;
    }

    # Real-time plain-text log tail (app/live_logs.py) — meant to be opened directly as a URL
    # (?token=<jwt>, since a plain browser navigation can't send an Authorization header), so it
    # needs its own path outside /api/ and outside the SPA catch-all below. proxy_buffering off
    # is the one thing that actually matters here: nginx buffers a proxied response by default,
    # which would hold new log lines until a buffer filled up instead of forwarding each one as
    # the backend writes it — defeating the entire point of a "real-time" tail.
    location /debug/logs/all {
        proxy_pass http://backend:8080/api/debug/logs/all;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1d;
    }

    # Vite fingerprints every built asset filename with a content hash, so /assets/* is safe
    # to cache aggressively — a content change always produces a new filename.
    #
    # A location block that sets its own add_header does NOT inherit the server block's
    # add_header directives at all (nginx-specific gotcha, not a bug) — so the security headers
    # above are repeated here and in location / below, which both already set Cache-Control.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;
    }

    # index.html is the only thing that ever references those hashed filenames, so it must
    # never be cached — otherwise a browser can keep serving a stale index.html pointing at
    # asset files from a previous deploy, making a new release look like it never happened.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;
    }
}
