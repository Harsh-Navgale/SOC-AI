networks:
  soc-net:
    driver: bridge

volumes:
  mongo-data:
  chroma-data:

services:
  mongodb:
    image: mongo:7
    container_name: soc-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    cpus: 1.0
    networks:
      - soc-net

  chromadb:
    image: chromadb/chroma:0.5.5
    container_name: soc-chromadb
    restart: unless-stopped
    volumes:
      - chroma-data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat', timeout=3)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    cpus: 1.0
    networks:
      - soc-net

  backend:
    build: ./backend
    container_name: soc-backend
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health', timeout=3)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      mongodb:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    mem_limit: 256m
    cpus: 1.0
    networks:
      - soc-net

  correlator:
    build: ./correlator
    container_name: soc-correlator
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os,pymongo; pymongo.MongoClient(os.environ['MONGO_URI'], serverSelectionTimeoutMS=3000).admin.command('ping')\" || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      mongodb:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    networks:
      - soc-net

  console:
    build: ./console
    container_name: soc-console
    stdin_open: true
    tty: true
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./org_docs:/data/org_docs
    depends_on:
      chromadb:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    networks:
      - soc-net

  frontend:
    build: ./frontend
    container_name: soc-frontend
    restart: unless-stopped
    ports:
      - "8443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 64m
    cpus: 0.5
    networks:
      - soc-net
